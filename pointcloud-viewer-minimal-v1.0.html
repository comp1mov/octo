<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Cloud Viewer - Minimal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        /* iPad fullscreen fix */
        @supports (padding: env(safe-area-inset-top)) {
            body {
                padding: 0 !important;
            }
            #canvas-container {
                width: 100vw;
                height: 100vh;
                padding: 0 !important;
                margin: 0 !important;
            }
        }
        
        /* Loading Animation */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: #fff;
            font-size: 24px;
            letter-spacing: 4px;
        }
        
        #loading-overlay.hidden {
            display: none;
        }
        
        #loading-text {
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1.0; }
        }
        
        #loading-progress {
            position: absolute;
            bottom: 40px;
            font-size: 14px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div>
            <div id="loading-text">LOADING...</div>
            <div id="loading-progress">0%</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

        // ============================================
        // CONFIG - EDIT THIS
        // ============================================
        const CONFIG = {
            // File URL (Dropbox, Google Drive, or local server)
            plyUrl: 'https://dl.dropboxusercontent.com/scl/fi/2vvc9mp0fob0bpgmr4azn/Colambia_Road_gallery_London_market-1.6_mln.ply?rlkey=b2g09ryq3gu0n82awi3q47y41',
            
            // Camera
            cameraPosition: [2, 1.5, 2],
            cameraTarget: [0, 0, 0],
            cameraFOV: 75,
            
            // Points
            pointSize: 2.0,
            
            // Grid
            showGrid: true,
            gridSize: 10,
            gridDivisions: 10,
            gridColor: '#444444',
            
            // Background
            backgroundColor: '#000000',
        };

        // ============================================
        // SCENE SETUP
        // ============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.backgroundColor);
        
        const camera = new THREE.PerspectiveCamera(
            CONFIG.cameraFOV,
            window.innerWidth / window.innerHeight,
            0.01,
            1000
        );
        camera.position.set(...CONFIG.cameraPosition);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(...CONFIG.cameraTarget);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        // ============================================
        // GRID
        // ============================================
        if (CONFIG.showGrid) {
            const grid = new THREE.GridHelper(
                CONFIG.gridSize,
                CONFIG.gridDivisions,
                CONFIG.gridColor,
                CONFIG.gridColor
            );
            scene.add(grid);
        }

        // ============================================
        // SHADERS
        // ============================================
        const vertexShader = `
            uniform float pointSize;
            attribute vec3 color;
            varying vec3 vColor;
            
            void main() {
                vColor = color;
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                gl_Position = projectionMatrix * mvPosition;
                gl_PointSize = pointSize * (300.0 / -mvPosition.z);
            }
        `;

        const fragmentShader = `
            varying vec3 vColor;
            
            void main() {
                // Circular points
                vec2 center = gl_PointCoord - vec2(0.5);
                float dist = length(center);
                if (dist > 0.5) discard;
                
                gl_FragColor = vec4(vColor, 1.0);
            }
        `;

        // ============================================
        // LOAD POINT CLOUD
        // ============================================
        const loader = new PLYLoader();
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingProgress = document.getElementById('loading-progress');

        loader.load(
            CONFIG.plyUrl,
            (geometry) => {
                console.log('✅ Point cloud loaded');
                
                // Create material
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        pointSize: { value: CONFIG.pointSize }
                    },
                    vertexShader: vertexShader,
                    fragmentShader: fragmentShader,
                    transparent: true,
                    depthWrite: false
                });
                
                // Create point cloud
                const pointCloud = new THREE.Points(geometry, material);
                scene.add(pointCloud);
                
                // Center camera on cloud
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                controls.target.copy(center);
                controls.update();
                
                // Hide loading
                loadingOverlay.classList.add('hidden');
            },
            (xhr) => {
                const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                loadingProgress.textContent = percent + '%';
                console.log(`Loading: ${percent}%`);
            },
            (error) => {
                console.error('Error loading point cloud:', error);
                document.getElementById('loading-text').textContent = 'ERROR LOADING';
                loadingProgress.textContent = 'Check console';
            }
        );

        // ============================================
        // ANIMATION LOOP
        // ============================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ============================================
        // WINDOW RESIZE
        // ============================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
