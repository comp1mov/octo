<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Cloud Viewer - Minimal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        /* iPad fullscreen fix */
        @supports (padding: env(safe-area-inset-top)) {
            body {
                padding: 0 !important;
            }
            #canvas-container {
                width: 100vw;
                height: 100vh;
                padding: 0 !important;
                margin: 0 !important;
            }
        }
        
        /* Loading Animation */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            color: #fff;
            font-size: 24px;
            letter-spacing: 4px;
        }
        
        #loading-overlay.hidden {
            display: none;
        }
        
        #loading-text {
            animation: pulse 1.5s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1.0; }
        }
        
        #loading-progress {
            font-size: 16px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div id="loading-text">LOADING</div>
        <div id="loading-progress">0%</div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

        // ============================================
        // CONFIG - EDIT THIS
        // ============================================
        const CONFIG = {
            // File URL (Dropbox, Google Drive, or local server)
            plyUrl: 'https://dl.dropboxusercontent.com/scl/fi/ndr999bp86vu232c53c9g/Church_Tirano_Itatly_06_2024.ply?rlkey=l5rmwlubco7a1j2jjsnzqu25i&',
            
            // Normalization
            normalizeCloud: true,     // Scale cloud to fit in [-1, 1] cube
            
            // Cloud Transform
            cloudRotation: {          // Static rotation (degrees)
                x: 0,
                y: 66,
                z: 0
            },
            cloudRotationSpeed: {     // Animated rotation speed (degrees/second)
                x: 0,
                y: 0,
                z: 0
            },
            cloudScale: {             // Scale per axis
                x: 2.0,
                y: 2.0,
                z: 2.0
            },
            
            // Camera
            cameraPosition: [-0.7, 1.4, -0.85],
            cameraTarget: [-0.36, 0.01, 0.06],
            cameraFOV: 75,
            cameraNear: 0.001,
            cameraFar: 1000,
            
            // Points
            pointSize: 0.005,          // Base size of points
            randomSize: 0.7,          // Random variation (0-1)
               
            // Point Size by Distance
            pointSizeByDistance: true,
            minDistance: 0.0,         // Distance where points are smallest
            maxDistance: 2.0,         // Distance where points are largest
            minPointSize: 0.2,        // Size at min distance
            maxPointSize: 3.0,        // Size at max distance
            
            // Grid
            showGrid: true,
            gridSize: 7,             // Total size of grid
            gridDivisions: 5,         // Number of divisions
            gridColor: '#FFFFFF',
            gridOffsetX: 0,           // Grid offset X
            gridOffsetY: -0.27,       // Grid offset Y  
            gridOffsetZ: 0,           // Grid offset Z
            gridFadeStart: 0.1,       // Start fading at 40% from center (0-1)
            gridFadeEnd: 1.0,         // Fully transparent at edges (0-1)
         
            // Background
            backgroundColor: '#000000',
        };

        // ============================================
        // SCENE SETUP
        // ============================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(CONFIG.backgroundColor);
        
        const camera = new THREE.PerspectiveCamera(
            CONFIG.cameraFOV,
            window.innerWidth / window.innerHeight,
            CONFIG.cameraNear,
            CONFIG.cameraFar
        );
        camera.position.set(...CONFIG.cameraPosition);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(...CONFIG.cameraTarget);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.update();

        // ============================================
        // GRID WITH RADIAL FADE
        // ============================================
        if (CONFIG.showGrid) {
            const grid = new THREE.GridHelper(
                CONFIG.gridSize,
                CONFIG.gridDivisions,
                CONFIG.gridColor,
                CONFIG.gridColor
            );
            grid.position.set(CONFIG.gridOffsetX, CONFIG.gridOffsetY, CONFIG.gridOffsetZ);
            
            // Custom shader material for fade effect
            const gridMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    gridColor: { value: new THREE.Color(CONFIG.gridColor) },
                    fadeStart: { value: CONFIG.gridFadeStart },
                    fadeEnd: { value: CONFIG.gridFadeEnd },
                    gridCenter: { value: new THREE.Vector3(CONFIG.gridOffsetX, CONFIG.gridOffsetY, CONFIG.gridOffsetZ) },
                    gridSize: { value: CONFIG.gridSize }
                },
                vertexShader: `
                    uniform vec3 gridCenter;
                    varying vec3 vWorldPos;
                    
                    void main() {
                        vec4 worldPos = modelMatrix * vec4(position, 1.0);
                        vWorldPos = worldPos.xyz;
                        gl_Position = projectionMatrix * viewMatrix * worldPos;
                    }
                `,
                fragmentShader: `
                    uniform vec3 gridColor;
                    uniform float fadeStart;
                    uniform float fadeEnd;
                    uniform vec3 gridCenter;
                    uniform float gridSize;
                    varying vec3 vWorldPos;
                    
                    void main() {
                        // Distance from center (normalized 0-1)
                        vec2 centerDist = (vWorldPos.xz - gridCenter.xz) / (gridSize * 0.5);
                        float dist = length(centerDist);
                        
                        // Radial fade
                        float alpha = 1.0 - smoothstep(fadeStart, fadeEnd, dist);
                        
                        // Base opacity
                        alpha *= 0.5;
                        
                        gl_FragColor = vec4(gridColor, alpha);
                    }
                `,
                transparent: true,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            
            // Replace grid material
            grid.material.dispose();
            grid.material = gridMaterial;
            
            scene.add(grid);
        }

        // ============================================
        // SHADERS
        // ============================================
        const vertexShader = `
            uniform float pointSize;
            uniform float randomSize;
            uniform bool pointSizeByDistance;
            uniform float minDistance;
            uniform float maxDistance;
            uniform float minPointSize;
            uniform float maxPointSize;
            uniform vec3 customCameraPos;
            
            attribute vec3 color;
            attribute float randomSizeFactor;
            varying vec3 vColor;
            
            void main() {
                // Use colors as-is (already in correct range)
                vColor = color;
                
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                gl_Position = projectionMatrix * mvPosition;
                
                // Start with base size
                float finalSize = pointSize;
                
                // Apply random size variation (multiplier)
                float randomMult = 1.0 + randomSize * (randomSizeFactor - 0.5) * 2.0;
                finalSize *= randomMult;
                
                // Apply distance-based sizing if enabled (multiplier)
                if (pointSizeByDistance) {
                    float dist = distance(customCameraPos, worldPosition.xyz);
                    float t = clamp((dist - minDistance) / (maxDistance - minDistance), 0.0, 1.0);
                    float distanceMult = mix(minPointSize, maxPointSize, t);
                    finalSize *= distanceMult;
                }
                
                // Apply perspective (closer = bigger)
                gl_PointSize = finalSize * (300.0 / -mvPosition.z);
            }
        `;

        const fragmentShader = `
            varying vec3 vColor;
            
            void main() {
                // Circular points
                vec2 center = gl_PointCoord - vec2(0.5);
                float dist = length(center);
                if (dist > 0.5) discard;
                
                // Gamma correction (like in main Post-Pointillism)
                vec3 correctedColor = pow(vColor, vec3(1.0/2.2));
                
                gl_FragColor = vec4(correctedColor, 1.0);
            }
        `;

        // ============================================
        // LOAD POINT CLOUD
        // ============================================
        
        // CORS Proxy helper
        function getCorsProxyUrl(url) {
            if (!url.startsWith('http') || url.includes('corsproxy') || url.includes('allorigins')) {
                return url;
            }
            
            if (url.includes('dropbox.com')) {
                const directUrl = url.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('&dl=1', '');
                return directUrl;
            }
            
            return url;
        }
        
        const loader = new PLYLoader();
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingProgress = document.getElementById('loading-progress');

        const finalUrl = getCorsProxyUrl(CONFIG.plyUrl);
        console.log('Loading from:', finalUrl);

        loader.load(
            finalUrl,
            (geometry) => {
                console.log('✅ Point cloud loaded');
                
                // Normalize cloud if enabled
                if (CONFIG.normalizeCloud) {
                    geometry.computeBoundingBox();
                    const bbox = geometry.boundingBox;
                    const center = new THREE.Vector3();
                    bbox.getCenter(center);
                    
                    const size = new THREE.Vector3();
                    bbox.getSize(size);
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 2.0 / maxDim;
                    
                    const positions = geometry.attributes.position;
                    for (let i = 0; i < positions.count; i++) {
                        positions.setXYZ(
                            i,
                            (positions.getX(i) - center.x) * scale,
                            (positions.getY(i) - center.y) * scale,
                            (positions.getZ(i) - center.z) * scale
                        );
                    }
                    positions.needsUpdate = true;
                    geometry.computeBoundingBox();
                    
                    console.log('📏 Cloud normalized to [-1, 1] cube');
                }
                
                // Add random size attribute
                const positions = geometry.attributes.position;
                const randomSizes = new Float32Array(positions.count);
                for (let i = 0; i < positions.count; i++) {
                    randomSizes[i] = Math.random();
                }
                geometry.setAttribute('randomSizeFactor', new THREE.BufferAttribute(randomSizes, 1));
                
                // Create material
                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        pointSize: { value: CONFIG.pointSize },
                        randomSize: { value: CONFIG.randomSize },
                        pointSizeByDistance: { value: CONFIG.pointSizeByDistance },
                        minDistance: { value: CONFIG.minDistance },
                        maxDistance: { value: CONFIG.maxDistance },
                        minPointSize: { value: CONFIG.minPointSize },
                        maxPointSize: { value: CONFIG.maxPointSize },
                        customCameraPos: { value: camera.position }
                    },
                    vertexShader: vertexShader,
                    fragmentShader: fragmentShader,
                    transparent: false,
                    depthTest: true,
                    depthWrite: true
                });
                
                // Create point cloud
                const pointCloud = new THREE.Points(geometry, material);
                
                // CRITICAL FIX: Disable frustum culling to prevent disappearing
                pointCloud.frustumCulled = false;
                
                window.pointCloudMaterial = material;
                
                // Apply rotation and scale
                pointCloud.rotation.x = CONFIG.cloudRotation.x * Math.PI / 180;
                pointCloud.rotation.y = CONFIG.cloudRotation.y * Math.PI / 180;
                pointCloud.rotation.z = CONFIG.cloudRotation.z * Math.PI / 180;
                pointCloud.scale.set(CONFIG.cloudScale.x, CONFIG.cloudScale.y, CONFIG.cloudScale.z);
                
                scene.add(pointCloud);
                window.pointCloudMesh = pointCloud;
                
                console.log('🔄 Cloud rotation:', CONFIG.cloudRotation);
                console.log('📏 Cloud scale:', CONFIG.cloudScale);
                
                // Center camera if needed
                geometry.computeBoundingBox();
                const center = new THREE.Vector3();
                geometry.boundingBox.getCenter(center);
                
                if (CONFIG.cameraTarget[0] === 0 && CONFIG.cameraTarget[1] === 0 && CONFIG.cameraTarget[2] === 0) {
                    controls.target.copy(center);
                    controls.update();
                }
                
                loadingOverlay.classList.add('hidden');
            },
            (xhr) => {
                const percent = (xhr.loaded / xhr.total * 100).toFixed(0);
                loadingProgress.textContent = percent + '%';
            },
            (error) => {
                console.error('Error loading:', error);
                document.getElementById('loading-text').textContent = 'ERROR';
            }
        );

        // ============================================
        // ANIMATION LOOP
        // ============================================
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = clock.getDelta();
            
            // Update camera position for distance sizing
            if (window.pointCloudMaterial) {
                window.pointCloudMaterial.uniforms.customCameraPos.value.copy(camera.position);
            }
            
            // Animated rotation
            if (window.pointCloudMesh) {
                if (CONFIG.cloudRotationSpeed.x !== 0) {
                    window.pointCloudMesh.rotation.x += CONFIG.cloudRotationSpeed.x * deltaTime * Math.PI / 180;
                }
                if (CONFIG.cloudRotationSpeed.y !== 0) {
                    window.pointCloudMesh.rotation.y += CONFIG.cloudRotationSpeed.y * deltaTime * Math.PI / 180;
                }
                if (CONFIG.cloudRotationSpeed.z !== 0) {
                    window.pointCloudMesh.rotation.z += CONFIG.cloudRotationSpeed.z * deltaTime * Math.PI / 180;
                }
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ============================================
        // WINDOW RESIZE
        // ============================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
