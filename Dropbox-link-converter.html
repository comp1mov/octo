<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropbox Link Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }
        
        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
            font-family: 'Monaco', 'Courier New', monospace;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result-label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .result-url {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
            word-break: break-all;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .copy-btn {
            background: #4CAF50;
        }
        
        .copy-btn:hover {
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        
        .success-message {
            background: #4CAF50;
            color: white;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin-top: 10px;
            display: none;
            animation: fadeIn 0.3s;
        }
        
        .success-message.show {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .example {
            background: #fff3cd;
            border: 2px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
        }
        
        .example strong {
            display: block;
            margin-bottom: 8px;
            color: #856404;
        }
        
        .example code {
            display: block;
            background: white;
            padding: 8px;
            border-radius: 4px;
            margin-top: 5px;
            word-break: break-all;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Dropbox Link Converter</h1>
        <p class="subtitle">Convert Dropbox share links to direct download URLs</p>
        
        <div class="input-group">
            <label for="original-url">Paste your Dropbox link:</label>
            <input 
                type="text" 
                id="original-url" 
                placeholder="https://www.dropbox.com/scl/fi/..."
            >
        </div>
        
        <button onclick="convertLink()">Convert Link</button>
        
        <div class="result" id="result">
            <div class="result-label">✅ Converted URL (Ready to use!):</div>
            <div class="result-url" id="converted-url"></div>
            <button class="copy-btn" onclick="copyToClipboard()">📋 Copy to Clipboard</button>
        </div>
        
        <div class="success-message" id="success-message">
            ✓ Copied to clipboard!
        </div>
        
        <div class="example">
            <strong>📌 Example:</strong>
            <strong>Before:</strong>
            <code>https://www.dropbox.com/scl/fi/abc123/file.ply?rlkey=xyz&dl=1</code>
            <strong>After:</strong>
            <code>https://dl.dropboxusercontent.com/scl/fi/abc123/file.ply?rlkey=xyz</code>
        </div>
    </div>

    <script>
        function convertLink() {
            const input = document.getElementById('original-url').value.trim();
            
            if (!input) {
                alert('Please paste a Dropbox link first!');
                return;
            }
            
            if (!input.includes('dropbox.com')) {
                alert('This doesn\'t look like a Dropbox link!');
                return;
            }
            
            // Convert the link
            let converted = input
                .replace('www.dropbox.com', 'dl.dropboxusercontent.com')
                .replace('&dl=1', '')
                .replace('?dl=1', '')
                .replace('dl=0', '');
            
            // Show result
            document.getElementById('converted-url').textContent = converted;
            document.getElementById('result').classList.add('show');
            
            // Auto-scroll to result
            document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        function copyToClipboard() {
            const url = document.getElementById('converted-url').textContent;
            
            navigator.clipboard.writeText(url).then(() => {
                // Show success message
                const successMsg = document.getElementById('success-message');
                successMsg.classList.add('show');
                
                setTimeout(() => {
                    successMsg.classList.remove('show');
                }, 2000);
            }).catch(err => {
                alert('Failed to copy: ' + err);
            });
        }
        
        // Allow Enter key to convert
        document.getElementById('original-url').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                convertLink();
            }
        });
    </script>
</body>
</html>
